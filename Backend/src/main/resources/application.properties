spring.application.name=BidCompliance
spring.datasource.url=jdbc:mysql://localhost:3308/bid_compliance
spring.datasource.username=app_user
spring.datasource.password=app_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

gemini.api-key=${GEMINI_API_KEY}
document.extraction.service.url=http://127.0.0.1:8001
gemini.model=gemini-2.5-flash

verification.pan.url=http://localhost:9001/api/verify/pan
verification.gst.url=http://localhost:9001/api/verify/gst
verification.udyam.url=http://localhost:9001/api/verify/udyam

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/bid-compliance

keycloak.admin.server-url=http://localhost:8081
keycloak.admin.realm=master
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.admin.client-id=admin-cli

keycloak.app.realm=bid-compliance