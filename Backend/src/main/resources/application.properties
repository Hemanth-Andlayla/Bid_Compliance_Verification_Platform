spring.application.name=BidCompliance
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

gemini.api-key=${GEMINI_API_KEY}
document.extraction.service.url=${DE_URL}
gemini.model=gemini-2.5-flash

verification.pan.url=${PAN_URL}
verification.gst.url=${GST_URL}
verification.udyam.url=${UDYAM_URL}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SECURITY_URL}

keycloak.admin.server-url=${KEYCLOAK_ADMIN_URL}
keycloak.admin.realm=${ADMIN_REALM}
keycloak.admin.username=${ADMIN_USERNAME}
keycloak.admin.password=${ADMIN_PASSWORD}
keycloak.admin.client-id=${ADMIN_CLIENT_ID}

keycloak.app.realm=${APP_REALM}